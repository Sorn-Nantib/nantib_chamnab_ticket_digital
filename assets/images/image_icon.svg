<svg xmlns="http://w3.org" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Layer (Back Card) -->
  <rect x="40" y="30" width="115" height="95" rx="14" fill="#84624D" transform="rotate(-12, 97.5, 77.5)" />
  
  <!-- Foreground Card Outline -->
  <rect x="52" y="52" width="115" height="95" rx="16" fill="none" stroke="#84624D" stroke-width="13" stroke-linejoin="round" />
  
  <!-- Foreground Card Inner Content (Masked/Positioned inside the frame) -->
  <g transform="translate(52, 52)">
    <!-- Sun -->
    <circle cx="28" cy="28" r="10" fill="#84624D" />
    
    <!-- Left Small Mountain -->
    <path d="M 0,85 L 25,50 L 55,85 Z" fill="#84624D" stroke="#84624D" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Right Large Mountain -->
    <path d="M 32,85 L 75,32 L 115,85 Z" fill="#84624D" stroke="#84624D" stroke-width="4" stroke-linejoin="round" />
  </g>
</svg>
